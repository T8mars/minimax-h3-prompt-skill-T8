interface:
  display_name: "对阵条不掉线｜小球方向连续到决胜反应"
  short_description: "让固定对阵信息条持续占据画面一部分，作为高速剪辑中的身份和阵营锚点；动态区域则按发球、接球、相持、险球和决胜顺序推进，每次切镜都用球的入射方向、击球手或身体重心完成接力，最后必须给出同一球的落点结果和双方不同反应。"
  default_prompt: "Use $persistent-matchup-strip-causal-rally-payoff to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

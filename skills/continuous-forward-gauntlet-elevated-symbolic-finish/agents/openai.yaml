interface:
  display_name: "连续前进闯阵｜防守闸门升级到高点标志"
  short_description: "用一次不切镜的前向跟随，把明确成年主角、可读目标方向和重复地标锁在同一废墟路线；敌人以逐层闸门进入，每一层必须用不同身体策略解决，并让上一动作的方向直接交给下一次接触。主角不能回到安全起点，最终离开地面冲突、沿已建立建筑登高，把原创标志安放在高点并以远景证明路线完成。"
  default_prompt: "Use $continuous-forward-gauntlet-elevated-symbolic-finish to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "连续跟随｜步态与弯曲地标共同计时"
  short_description: "在弯曲受限通道中使用一次不中断的后方跟随；人物步态与画面位置稳定，重复灯具、轨缝与壁肋成为可数进度时钟，隧道曲率缓慢移动消失点，最后停在明显更深的位置，不虚构门槛、偶遇或改道。"
  default_prompt: "Use $follow-geometry-as-progress-clock to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

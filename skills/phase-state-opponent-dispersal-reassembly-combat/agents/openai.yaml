interface:
  display_name: "相态敌手攻防｜实体命中、粒子卸力与反向重组"
  short_description: "先让实体主角与可辨识敌手共享一条攻防轴线；每次重击都必须让敌手从完整轮廓转成与接触方向一致的丝束、尘粒或涡流，再由同一物质在原空间重组。用地面、逆光和尘雾维持方位，逐级扩大攻击尺度，最后让一次看似终结的分散反向复归，兑现敌手相态能力。"
  default_prompt: "Use $phase-state-opponent-dispersal-reassembly-combat to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

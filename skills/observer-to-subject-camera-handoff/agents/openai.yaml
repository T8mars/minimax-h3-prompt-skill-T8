interface:
  display_name: "镜头交接｜外部观察转为主体掌镜"
  short_description: "先由外部观察镜头发现并跟随主体，让主体完成一次地点专属的环境交互，再给出环境尺度证明；随后使用遮挡、设备安装或载体交接等有动机的连续桥，片尾只把拍摄权交给主体一次。"
  default_prompt: "Use $observer-to-subject-camera-handoff to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

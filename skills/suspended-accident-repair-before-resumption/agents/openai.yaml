interface:
  display_name: "冻结修复｜事故悬停、唯一修复者到全域复流"
  short_description: "先建立拥挤空间的正常运动和一个完整物件，再让一次事故同时拆散物件并冻结环境；只允许一名专业角色继续移动，按可追踪顺序回收组件、重建物件并完成交付，最后全域只复流一次。"
  default_prompt: "Use $suspended-accident-repair-before-resumption to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

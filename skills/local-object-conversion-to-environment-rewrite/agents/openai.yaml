interface:
  display_name: "逐物改写｜局部对象到整片环境"
  short_description: "保持同一第一视角和真实环境，使用一个持续可见的触发工具依次选中不同尺度对象；每次只改写一个局部对象并保留其位置关系，最后把相同转换规则扩大到整片环境。"
  default_prompt: "Use $local-object-conversion-to-environment-rewrite to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

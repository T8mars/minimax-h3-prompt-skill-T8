interface:
  display_name: "多人商品一致性｜常驻参考板与角色接力实证"
  short_description: "先把原创商品、至少三名明确成年角色和各自身份锚点集中写入一条常驻参考板；主画面依次让角色在不同场景完成商品展示、接力与使用动作，参考板始终作为视觉核验基准。每次换人或换景都保留同一包装比例、标志位置和主色，最后让全部角色与商品同框，再切到无歧义包装终局。"
  default_prompt: "Use $persistent-reference-board-multi-character-product-continuity to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

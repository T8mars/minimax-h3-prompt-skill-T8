interface:
  display_name: "触觉旅行章法｜近物接触到高位全景递进"
  short_description: "用同一人物、服装与行进方向穿过四个空间章节，每章先让手接触一种本地材质或对象，再把景别从窄巷近物逐步扩到市场、人水关系和高处城市全景；统一的模拟胶片缺陷把离散地点压成一段可回忆的旅行档案。"
  default_prompt: "Use $tactile-travel-chapters-scale-ascent to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "连续推进｜重复地标计时并抵达更深通道"
  short_description: "在受限通道中持续前进，以重复固定地标和门洞视差作为进度时钟；接近结尾时只转向或跨越一次可见边界，并停在材质更深的次级通道，不虚构检查、诊断或隐藏威胁。"
  default_prompt: "Use $follow-repeating-landmarks-deeper to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

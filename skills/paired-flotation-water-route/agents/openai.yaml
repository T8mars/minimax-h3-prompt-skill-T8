interface:
  display_name: "双脚浮具水面路线｜交替承重、连续尾流与远端抵达"
  short_description: "固定同一成年人物、码头、水面和远方地标，先证明双脚分别绑定独立透明浮具；人物以左右脚交替承重离开码头，每次接触都产生可归因圆波和连续尾流，短暂回看后继续沿同一方向远离并接近既定目标。"
  default_prompt: "Use $paired-flotation-water-route to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

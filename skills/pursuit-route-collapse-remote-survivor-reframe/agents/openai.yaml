interface:
  display_name: "追逐路线崩塌再解释｜逃生载体毁灭后目标异地重现"
  short_description: "先让一名明确成年原创人物在空旷交通节点发现逼近者，并把最后一班载体建立为唯一可读逃生路线；连续追逐把人物送入载体后，路线在离站阶段遭到一次不可逆破坏。随后从烟尘与残骸切到远处安全高位，让同一成年人物稳定重现并直视来向，以空间分离重新解释前段追逐，但不复制原片人物、地铁、爆炸、台词或结尾文字。"
  default_prompt: "Use $pursuit-route-collapse-remote-survivor-reframe to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

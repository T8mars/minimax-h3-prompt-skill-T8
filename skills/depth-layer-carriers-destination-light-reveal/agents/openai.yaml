interface:
  display_name: "纵深载体引导目的光｜稳定结构中逐级扩大出口"
  short_description: "在封闭暗空间里先建立一条清楚的纵向运动轴，让重复慢速载体分布在前中后景，固定建筑肋骨持续提供比例和位移参照；摄影机沿同一轴平稳推进或上升，远端目的光逐步增大并提高占比，最终以光口压倒结构完成空间释放。"
  default_prompt: "Use $depth-layer-carriers-destination-light-reveal to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

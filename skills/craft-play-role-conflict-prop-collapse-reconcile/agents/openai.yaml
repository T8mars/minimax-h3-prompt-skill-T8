interface:
  display_name: "手作角色扮演｜分工亮相、道具误伤与集体和解"
  short_description: "先让小组共同制作轻质道具，再用服装和可穿戴装置分配对立角色；冲突必须围绕一个预先可见的脆弱公共道具展开，一次过度表演造成可读坍塌，所有人先停住确认后果，再共同退出角色并以修复或坐在一起结束。"
  default_prompt: "Use $craft-play-role-conflict-prop-collapse-reconcile to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

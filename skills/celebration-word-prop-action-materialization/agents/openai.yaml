interface:
  display_name: "庆典词语实体化｜一词一动作一材质结果的逐章升级"
  short_description: "同一明确成年主持人贯穿多个庆典模块，每章只引入一个原创短词、一件道具和一次动作；动作必须让文字发生对应的物理变化，如吹灭、膨胀、展开或点亮。通过重复舞台轴与配色保持身份，最后把所有庆典状态汇入一个原创祝福主标。"
  default_prompt: "Use $celebration-word-prop-action-materialization to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

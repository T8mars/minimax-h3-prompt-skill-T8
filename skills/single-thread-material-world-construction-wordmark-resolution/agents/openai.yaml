interface:
  display_name: "单线织世｜一根材料分叉建景再回收到原创标记"
  short_description: "先把一根材料线和承载面锁定，再让它连续分叉、染色并把沿途结构建成可读地貌；所有新元素必须从仍可追踪的同一线束生长，不能凭空换景。密度达到峰值后，让支线按相反顺序回收并组成全新原创名称或徽记。"
  default_prompt: "Use $single-thread-material-world-construction-wordmark-resolution to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

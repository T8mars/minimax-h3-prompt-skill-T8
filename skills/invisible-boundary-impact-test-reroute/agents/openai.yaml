interface:
  display_name: "不可见边界验真｜碰撞、手测与改道离开"
  short_description: "先用一条视觉上完全畅通的路线建立通行预期，再让明确成年角色在同一轴线上遭遇一次不可见阻断；必须完整显示接近、接触和身体回弹。角色先检查受影响部位，再回到碰撞点以手掌进行一次受控测试，让边界通过触感与涟漪证据显形；结尾角色明确改道离开，边界仍留在原路径。"
  default_prompt: "Use $invisible-boundary-impact-test-reroute to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "跨媒介角色集结｜五个独立风格模块最终共享同一舞台"
  short_description: "每章用一个原创角色、一个明确媒介规则和一个短动作证明该风格，避免仅靠滤镜换色；固定构图位置、徽记或运动方向在章节间接力。所有角色最后必须以各自材质完整进入同一中性舞台，而不是被统一成同一种风格。"
  default_prompt: "Use $multi-medium-character-module-ensemble-convergence to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

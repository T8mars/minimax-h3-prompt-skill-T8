interface:
  display_name: "实用整理确认关系｜接触、退开与双向微反应"
  short_description: "把两名明确成年角色锁在同一安静空间，先建立一项真实可见的服装或装备不整，再让帮助者用一次连续、功能明确的双手动作完成调整。接触结束后必须退开，并分别给被帮助者与帮助者一个克制微反应；结尾回到两人同框，用整理后的物件和稳定姿态证明准备完成，不能依赖未经验证的对白语义。"
  default_prompt: "Use $practical-adjustment-nonverbal-readiness-confirmation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

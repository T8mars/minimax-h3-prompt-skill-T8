interface:
  display_name: "画内涂鸦｜现实互动逐步绘出隐藏世界"
  short_description: "用第一视角真实互动作为涂鸦触发器：每次手、宠物或物件完成一个可见动作，新的线描符号就锚定在对应现实表面；符号从单个提示升级为动作回声、隐藏对象和路线，最后整套图形连接成覆盖环境的可读世界。"
  default_prompt: "Use $diegetic-doodle-response-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "停顿型角色预告｜凝视、书法字卡、一次动作释放与徽记收束"
  short_description: "先用长于常规剪辑的角色凝视建立身份与情绪，再让一条墨迹和极少文字承担概念转场；回到远景继续等待，随后只释放一次清楚动作，把此前静止蓄积的能量兑现，最后以角色全身、原创名称和单一徽记组成稳定海报。"
  default_prompt: "Use $held-character-brush-title-action-release-emblem to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

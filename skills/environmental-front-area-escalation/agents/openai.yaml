interface:
  display_name: "环境前沿｜局部点燃到全域占据"
  short_description: "在同一地理中用一个可追踪的环境前沿逐阶段扩张：局部起点、连续蔓延、跨越地标、遮蔽更多空间，最终用广角证明场地状态已整体改变；不依赖来源中的战斗身份或火焰表面。"
  default_prompt: "Use $environmental-front-area-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

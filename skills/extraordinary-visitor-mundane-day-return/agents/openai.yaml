interface:
  display_name: "异客日常化｜多项普通任务累积到黄昏返回"
  short_description: "先用一个一眼可识别的非常规访客制造钩子，随后不解释其来历，而让同一身份锚点依次完成驾驶、取物、烹饪、护理和园艺等互不重复的普通任务；每段都以可见结果落地，最后回到与开场相同的住宅边界和夜间静止状态，让荒诞前提被日常秩序逐步正常化。"
  default_prompt: "Use $extraordinary-visitor-mundane-day-return to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "目标先现的仪式行进｜前景队列与地标尺度同步放大"
  short_description: "开场就完整展示宏大目的地、可读路线和一组前景行进者，不靠隐藏或反转制造看点。全片保持同一朝向，让行进者沿路线持续缩短与地标的距离，同时用重复旗帜、服装或载体建立队列节奏；摄影机只做克制推进和轻微升高，结尾让人物仍在场但目的地占据更大画面比例，以尺度增长兑现庄严感。"
  default_prompt: "Use $destination-first-processional-scale-approach to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "训练复投｜计时检查触发受挫后重新上路"
  short_description: "先用持续路线动作证明真实投入，再切到一个可量化检查点；检查结果触发短暂失望和生理残余，但角色不直接获得能力升级，而是完成一个有限恢复动作、重新面向同一路线，并以黄昏停留和坚定表情把失败转化为下一轮承诺。"
  default_prompt: "Use $effort-checkpoint-setback-recommitment-route to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "实拍印刷层接力｜人物、商品细节与字卡共同推进"
  short_description: "先用一名明确成年主体和一套稳定服装锚点建立实拍身份，再让撕纸边缘、印刷纹理和短字卡依次进入同一画面。每个拼贴层都必须与人物动作、服装部件或环境转场发生可见交接，而不是盖住主体；镜头在全身、材质微距、图形海报和多人陈列之间改变职责，最后把前面出现的身份、细节和短语汇总成一张清楚停留的终局版面。"
  default_prompt: "Use $live-subject-print-collage-ad-relay to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

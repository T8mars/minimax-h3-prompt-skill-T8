interface:
  display_name: "规则闯关｜吸收能力后从平面赛道升维"
  short_description: "让一个外来主体进入规则清晰的平面路线，先用移动、避障和收集建立关卡语法，再通过一次可见能力获取改变运动方式；临近终点时让同一路线整体升为三维，主体方向、身份和目标连续不断，最终抵达可读终点。"
  default_prompt: "Use $rule-acquisition-dimensional-course-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "世界换材｜主体不断线穿过环境突变"
  short_description: "先用稳定地形和连续跟拍锁定主体路线，在一次明确冲击点让周围世界整体换成另一套物质规则；主体运动、方向和速度连续不断，最终用新世界中的可读出口证明不是普通转场。"
  default_prompt: "Use $route-continuity-through-world-conversion to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "输入—屏幕—结果—反应｜实体操作与虚拟反馈逐拍闭环"
  short_description: "先建立成年玩家、实体控制器和屏幕同框关系；每个虚拟动作前必须先看见一次具体输入，屏幕反馈随后发生，玩家再给出清楚可辨的人物反应。用选角、移动、反击和胜负四级闭环升级，终局只确认结果与人物，不补写来源中未出现的再开一局。"
  default_prompt: "Use $input-screen-result-reaction-causal-loop to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

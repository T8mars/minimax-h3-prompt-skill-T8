interface:
  display_name: "前景执念对抗背景灾难｜危险升级但微小任务不断线"
  short_description: "把一名明确成年原创人物和一个微小、可持续操作的前景任务锁在画面中心，让背景危险从人群混乱、横穿武器、爆炸到贴脸擦过逐级升级；人物只做必要闪避并始终返回同一任务，结尾危险退去而注意力依旧不变，以尺度与行为反差形成喜剧。"
  default_prompt: "Use $foreground-fixation-background-hazard-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

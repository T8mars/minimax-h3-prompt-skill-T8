interface:
  display_name: "地面召集天空编队｜近距确认、首领降落与乘骑离场"
  short_description: "先用孤立地面角色和远处空中群体建立垂直权力差，再通过一次清楚的手势或姿态让空群由散乱逼近转为有序绕行；用近距首领确认把群体回应收束到单一载体，随后让首领完成可见降落和俯身，人物登乘后以共同起飞和高位远景结束。"
  default_prompt: "Use $ground-caller-aerial-swarm-order-mount-departure to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

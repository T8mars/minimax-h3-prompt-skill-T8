interface:
  display_name: "道具携带者主动共享｜遮蔽物到位后完成亲密确认"
  short_description: "先让一个等待者暴露在清楚天气压力下，再让较小的道具携带者从画外进入；以道具覆盖范围作为可见进度条，靠近后先让遮蔽物同时覆盖双方，再用一次克制的身体贴近确认关系，结尾保持共同庇护状态而不是继续动作。"
  default_prompt: "Use $prop-bearing-helper-shared-shelter-bond to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

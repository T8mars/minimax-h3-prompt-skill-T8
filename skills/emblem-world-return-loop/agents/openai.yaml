interface:
  display_name: "标志入境｜穿行世界后回收到原形"
  short_description: "先把一个简洁标志当作入口和几何规则，进入由其形状、色彩与方向构成的三维世界；经过环境、角色与一次尺度跃迁后，所有结构必须可追溯地重新折回同一个标志。"
  default_prompt: "Use $emblem-world-return-loop to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "自主收纳回路｜物件逐层入箱、空间扰动与闭合恢复"
  short_description: "固定房间、床面和旅行箱的注册关系，先逐件建立衣物从散置状态到分区入箱的可见路径；装满后用一次空间扰动打散局部秩序，再让同一批物件沿可追踪路径恢复，并以同一旅行箱完整闭合收尾。"
  default_prompt: "Use $autonomous-packing-disruption-recovery to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

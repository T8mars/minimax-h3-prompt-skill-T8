interface:
  display_name: "微型引路｜重复现身到终点材质回声"
  short_description: "用一个小型非语言向导先吸引注意，再让它在不同空间孔洞或路标处重复现身，带动主体与镜头沿连续路线深入；最终向导进入的目的地以同一材质、形状或色彩回声兑现前段承诺。"
  default_prompt: "Use $small-guide-route-destination-echo to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

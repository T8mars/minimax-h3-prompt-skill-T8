interface:
  display_name: "样本倍增｜机器开启后连续输出同类群体"
  short_description: "先让一个可辨样本与封闭机器同框，经过一次外部触发后打开独立输出阈值；同类实例从阈值连续出现并在机器周围累积，而原样本始终留在顶部作为身份对照，最终同框证明倍增结果。"
  default_prompt: "Use $exemplar-triggered-output-multiplication to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

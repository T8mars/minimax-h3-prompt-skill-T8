interface:
  display_name: "功能问答闭环｜人物疑问由设备状态完成证明"
  short_description: "先让提出疑问的人与正在运行的设备同框，形成清楚的功能缺口；再切到第二位人物查看一个远程状态载体并作出可见回应，最后返回原空间，让设备状态变化和提问者反应共同承担证明，而不是只靠字幕或口头宣称。"
  default_prompt: "Use $question-machine-state-proof-relay to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "路线揭幕｜重复通道依次亮出原创反应场景"
  short_description: "让同一条移动通道反复回场，每次用经过物形成完整遮挡，再在同一空间位置揭出一个独立原创反应场景；每个场景只保留一次清楚关系变化和短暂停顿，随后回到通道继续接力，最后用新的原创场景收束。"
  default_prompt: "Use $recurring-route-original-tableau-reveal-montage to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

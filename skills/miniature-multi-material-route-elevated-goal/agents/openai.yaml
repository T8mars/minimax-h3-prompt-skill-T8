interface:
  display_name: "微缩多材质路线｜动作动词接力到高点终点"
  short_description: "先用一名明确成年微缩主体、近处尺度物和远端高点目标建立完整路线；让主体依次进入至少三种材质不同的地形，每种地形都迫使移动动词发生变化，并把上一动作的落点直接交给下一段。路线与目标方向不得重置，最后主体必须真正到达此前可见的高点，并用宽景同时证明走过的材质带和终点。"
  default_prompt: "Use $miniature-multi-material-route-elevated-goal to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

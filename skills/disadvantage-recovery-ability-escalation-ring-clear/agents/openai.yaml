interface:
  display_name: "弱势反攻清场｜贴地恢复、水盾承压到环形冲击"
  short_description: "先让明确成年主体处于多人包围的可读弱势，随后用贴地低扫争取站位、近身水盾承受一次冲击，再把同一水体升级为定向水炮与环形冲击；每一级都由前一级状态留下连续水迹，终局以对手倒地和主体平静站立证明清场。"
  default_prompt: "Use $disadvantage-recovery-ability-escalation-ring-clear to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "连续目标防御｜固定核心、双角色接力与威胁环升级"
  short_description: "把一个持续可见的核心目标作为空间原点，用不停机的环绕和贴身跟随在敏捷防守者、重型伙伴和逼近敌群之间转移注意力；每次角色接力都要继承上一动作的方向或结果，威胁从外圈逼近到贴身再扩散为环境状态，最终以共同防线和核心状态收束。"
  default_prompt: "Use $continuous-objective-defense-role-swap-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

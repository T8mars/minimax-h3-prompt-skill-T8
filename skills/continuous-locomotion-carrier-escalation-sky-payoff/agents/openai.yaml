interface:
  display_name: "连续载具升级｜滑行、冲浪、生物接力到高空释放"
  short_description: "同一明确成年主体沿一个前进方向连续移动，每次只在速度、表面或高度达到阈值后，把运动完整交给下一种原创载具或伙伴；身份、方向和动量不重置。由地面、浪面、生物背部逐级升高，最后用高空释放兑现升级。"
  default_prompt: "Use $continuous-locomotion-carrier-escalation-sky-payoff to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

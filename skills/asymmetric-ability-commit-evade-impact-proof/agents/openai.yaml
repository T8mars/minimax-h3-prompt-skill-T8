interface:
  display_name: "速度对蛮力的非对称证明｜重击承诺、连续闪避与环境撞击"
  short_description: "先让轻型成年角色与重型原创对手在同一仓库轴线上建立能力反差；重型角色每次必须完整承诺一条可读攻击轨迹，轻型角色只靠位移、绕身和借力闪避，不用对等力量回击。最大重击最终撞毁已建立的墙体，环境后果证明力量，而轻型角色从另一侧稳定起身证明速度。"
  default_prompt: "Use $asymmetric-ability-commit-evade-impact-proof to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

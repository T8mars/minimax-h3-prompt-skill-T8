  short_description: "让一条边界清楚的活动带沿主体移动，带内即时显示转换后的媒介，带外继续保留原状态；多次通过累积覆盖整体，最后让扫描带退出以证明完整、稳定的转换结果。"
  default_prompt: "Use $bounded-render-band-progressive-conversion to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

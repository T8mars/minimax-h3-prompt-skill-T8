  short_description: "同一明确成年自拍视频主体沿一个节庆路线前进，每章用上一章获得或使用的物件触发下一活动：食物证明到场，游戏动作产生奖品，奖品抬起引导视线到高空终景，最后人物带着累积物件告别。由近物触觉逐级扩展到群体与天空。"
  default_prompt: "Use $object-handoff-festival-vlog-escalation to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

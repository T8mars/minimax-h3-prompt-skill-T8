interface:
  display_name: "日常任务到呼吸复位｜前景过渡、静坐微动与继续离场"
  short_description: "同一明确成年人先完成一个普通触觉任务，再由前景物或建筑边界把动作段过渡到静坐段；人物只做一次慢呼吸、微笑与细微头发衣料变化，摄影克制推进。复位完成后，人物沿既定方向重新起身离场，证明静默不是终点。"
  default_prompt: "Use $ordinary-task-to-breathing-reset-exit to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "显物兑现｜空手基线到道具功能与终态回扣"
  short_description: "先用清楚的空手和稳定人物建立不可争议的基线；单一触发后让关键道具通过可追踪的分段装配出现，人物立即用它完成可验证功能，环境随使用逐步回应，结尾让道具持续存在并留下一个与功能相关的终态变化。"
  default_prompt: "Use $empty-hand-functional-object-materialization-payoff to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "道具复得｜外部夺走、同伴安抚与隐蔽取回"
  short_description: "先让两个角色共同使用一个高价值道具，再由外部角色明确夺走；让两位角色分别出现失落和安抚反应，随后由同伴从早已建立的隐蔽位置取回同类道具，恢复共同活动并以默契终态收束。"
  default_prompt: "Use $prop-loss-consolation-hidden-recovery to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

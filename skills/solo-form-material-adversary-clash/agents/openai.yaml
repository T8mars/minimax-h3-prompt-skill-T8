interface:
  display_name: "独演成敌｜动作材质凝成对手后碰撞"
  short_description: "先用单一主体的完整动作建立可辨招式与材质签名，再让环境材质积累并凝成独立对手；中后段通过一次空间跃迁把双方拉入正面对抗，最后引入第二能量材质完成碰撞并回到主体可读终态。"
  default_prompt: "Use $solo-form-material-adversary-clash to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

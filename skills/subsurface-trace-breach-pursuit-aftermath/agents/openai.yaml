interface:
  display_name: "地下轨迹破土｜尺度反转、追逐穿越与空场余波"
  short_description: "先用明确成年人物、普通道路和重复地标建立日常尺度，再让一条与人物同向移动的地下轨迹成为可追踪预警。轨迹必须经过至少两次强度升级后在同一地理破土，巨物与人物短暂同框以证明比例，并沿已建立路线完成一次追逐或横穿；结尾保留尘土、破损地表和空出的道路，让突袭造成的状态变化可见。"
  default_prompt: "Use $subsurface-trace-breach-pursuit-aftermath to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

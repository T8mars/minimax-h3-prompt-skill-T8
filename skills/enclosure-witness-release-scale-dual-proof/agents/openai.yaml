  short_description: "先在封闭空间中用近距离见证者建立异常，再让见证者的指向或动作把镜头释放到外部；完整展示环境尺度现象后，以不同于来源表面的双视图同时保留见证者和现象，形成尺度与反应的共同证明。"
  default_prompt: "Use $enclosure-witness-release-scale-dual-proof to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

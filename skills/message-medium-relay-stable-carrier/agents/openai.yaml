  short_description: "固定一个可追踪人物或载体，让一组相关但不断推进的短信息依次进入性质明显不同的实体媒介；每次转换都由人物动作或镜头路线触发，并用新的材质物理证明信息链连续，最终在新的终端媒介中完成清楚锁定，而不是回到起点。"
  default_prompt: "Use $message-medium-relay-stable-carrier to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "平面民间故事展开｜章节换景与月轮升格"
  short_description: "把长叙事压进一个始终可辨的手工平面舞台：先用剪影建立发现者与封闭容器，再让容器打开并释放主角；场景折叠为社区空间，外部角色以道具完成社会承认；一次全画面纸张爆发展开夜空，主角随后沿明确路径升向此前建立的天体，最终回到包含地面、见证者和天体的徽章式大全景。"
  default_prompt: "Use $planar-folktale-chapter-unfolding-emblematic-ascent to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

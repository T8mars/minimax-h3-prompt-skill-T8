interface:
  display_name: "连续拉远尺度揭危｜小型载体、扩张暗区与临界停留"
  short_description: "先用一个持续前进的小型载体作为尺度锚点，镜头不切地逐步升高并后退；一个起初像普通暗纹的环境异常必须保持中心关系并不断占据更大画幅，载体的航迹、速度和尺寸持续可读，最终在进入不可逆临界区之前停留，让尺度和危险都由同一连续镜头证明。"
  default_prompt: "Use $continuous-retreat-scale-anchor-expanding-hazard to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

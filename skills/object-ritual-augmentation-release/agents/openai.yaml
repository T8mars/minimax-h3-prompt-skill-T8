interface:
  display_name: "物件仪式增幅｜交付基线、环形锁定与能量释放"
  short_description: "在同一封闭环境里建立两名成年角色和一件中立物件；物件先被竖直悬停，再由另一角色生成可数环形结构完成校准，能量沿物件自下而上释放，最后双方回到不攻击的稳定关系。"
  default_prompt: "Use $object-ritual-augmentation-release to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "手势收集无形现象｜凝聚成球后释放并让环境回应"
  short_description: "一名明确成年原创人物在连续行进中停下，先以空手和环境常态建立“不可见”基线，再用双手形成可读收集容器；细线、微粒或波纹只从周边环境向掌心汇聚，压缩成单一可握持核心，人物完成一次释放后让同一物质扩散回城市并改变可见氛围。"
  default_prompt: "Use $gesture-collect-intangible-orb-release-environment-response to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

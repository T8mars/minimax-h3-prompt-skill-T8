interface:
  display_name: "几何注册匹配片头｜平面路径、实体面板与终局印记"
  short_description: "先建立可精确注册的二维线网和一个颜色锚点，让书写工具沿网格揭示第一条职员表；在同一构图接缝处把线网匹配成实体孔阵并揭示第二条职员表，随后让同一颜色锚点吸收一个关键物件、发生一次实体开裂，最后把材质铺满画面并稳定承载原创主标题。"
  default_prompt: "Use $registered-geometry-material-match-credit-title to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

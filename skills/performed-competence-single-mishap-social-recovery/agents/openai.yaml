interface:
  display_name: "帅气展示瞬间失手｜单次事故与社交收尾"
  short_description: "先让一名明确成年角色在熟人面前主动摆出可读的自我展示意图，再用一段连续动作把自信逐级抬高。只允许一次清楚的物理失误打断表演，必须完整展示失衡、落地与后果；旁观者先作克制反应，表演者随后以一个简短恢复动作承认尴尬，笑点由社会关系闭合而不是只靠摔倒。"
  default_prompt: "Use $performed-competence-single-mishap-social-recovery to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

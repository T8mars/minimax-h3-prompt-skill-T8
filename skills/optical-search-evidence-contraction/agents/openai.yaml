interface:
  display_name: "光学搜索｜远景线索递进到细节确认"
  short_description: "让同一受限光学视野承担完整搜索：先锁定远处地点，再沿一个可见异常逐级收紧到结构、主体和局部细节；每次靠近都回答一个更具体的问题，最后用极近特征完成确认而不是再切到全知镜头。"
  default_prompt: "Use $optical-search-evidence-contraction to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "场所反制｜追踪威胁与环境物件接力"
  short_description: "用一个公共路线建立主角身份和运动方向，让同一追踪威胁在至少两个功能不同的室内场所重复出现；主角每次只能调用当前场所独有的可见物件完成一次不同反制，随后继续前进，最终回到开场公共路线并以稳定身份、步态和视线结束。"
  default_prompt: "Use $recurring-threat-location-inventory-defense-return to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

interface:
  display_name: "定版角色谱系｜同字段框架区分多种原型"
  short_description: "锁定一套完全相同的档案版式、字段顺序和画面注册，让至少五个不同角色依次进入同一槽位；每个角色同时改变主色、轮廓、姿态和一个职责符号，并保留短暂微动作停留，使观众能快速比较一整套世界观原型而不丢失分类体系。"
  default_prompt: "Use $fixed-dossier-archetype-roster to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

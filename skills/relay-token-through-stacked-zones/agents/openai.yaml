interface:
  display_name: "分层接力｜小物体穿越多区域完成传递"
  short_description: "在同一可读空间建立多个相连区域，让一个小物体从首位角色出发；物体通过可见表面改变路线，后续见证者持续追踪，最终交给自主载体，并以全景闭合完整接力。"
  default_prompt: "Use $relay-token-through-stacked-zones to turn my idea into original MiniMax H3 and Seedance 2.0 prompts while preserving the selected Creative DNA."

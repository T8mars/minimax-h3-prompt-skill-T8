name: Bug report / 错误报告
description: Report a reproducible desktop viewer, catalog, Skill, or documentation problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 Token、Cookie、本机用户名或私有提示词。安全问题请使用私密漏洞报告。
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Electron desktop viewer
        - Catalog case
        - Installable Skill
        - GIF or MP4 playback
        - Installation or update
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
      description: Give the shortest complete sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Screenshots are welcome after removing private information.
